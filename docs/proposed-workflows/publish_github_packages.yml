# Proposed replacement for .github/workflows/publish_rubygems.yml
#
# Agents can't push to .github/workflows/, so a maintainer installs it:
#   git rm .github/workflows/publish_rubygems.yml
#   git mv docs/proposed-workflows/publish_github_packages.yml .github/workflows/
#   (then delete docs/proposed-workflows/)
#
# Publishes to the GitHub Packages RubyGems registry of the patterninc org. Needs no secrets
# beyond the built-in GITHUB_TOKEN.
name: Publish Gem

on:
  push:
    branches: [master]
    # Only a version bump can produce a new release.
    paths: [lib/query_helper/version.rb]
  workflow_dispatch: # re-run a release that failed part way

# Two merges in quick succession must not race on the same version.
concurrency:
  group: publish-gem
  cancel-in-progress: false

permissions:
  contents: write  # push the vX.Y.Z tag, create the GitHub release
  packages: write  # push to the GitHub Packages RubyGems registry

env:
  REGISTRY: https://rubygems.pkg.github.com/${{ github.repository_owner }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need existing tags to know whether this version is already released

      - name: Set up Ruby 2.7.2
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.7.2
          bundler-cache: true

      - name: Read version and check it is new
        id: version
        run: |
          VERSION=$(ruby -r./lib/query_helper/version -e 'print QueryHelper::VERSION')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "v$VERSION is already released, nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.version.outputs.new == 'true'
        env:
          RAILS_ENV: test
        run: bundle exec rspec spec

      - name: Build gem
        if: steps.version.outputs.new == 'true'
        run: gem build query_helper.gemspec

      - name: Push gem to GitHub Packages
        if: steps.version.outputs.new == 'true'
        env:
          GEM_HOST_API_KEY: "Bearer ${{ secrets.GITHUB_TOKEN }}"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$HOME/.gem"
          (umask 077; printf -- "---\n:github: %s\n" "$GEM_HOST_API_KEY" > "$HOME/.gem/credentials")
          gem push --key github --host "$REGISTRY" "query_helper-$VERSION.gem"

      # After the push on purpose: if the push fails there is no tag, so a re-run tries again.
      - name: Tag and create GitHub release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v h="## $VERSION" '$0 == h {f=1; next} /^## / {f=0} f' CHANGELOG.md > release_notes.md
          [ -s release_notes.md ] || echo "See CHANGELOG.md" > release_notes.md
          git tag "v$VERSION"
          git push origin "v$VERSION"
          # The .gem is deliberately not attached: this repo is public, the package registry is not.
          gh release create "v$VERSION" --title "v$VERSION" --notes-file release_notes.md
